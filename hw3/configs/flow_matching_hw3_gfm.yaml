data:
  dataset: "celeba"
  root: "./data/celeba-subset"
  from_hub: false
  repo_name: "electronickale/cmu-10799-celeba64-subset"
  image_size: 64
  channels: 3
  num_workers: 4
  pin_memory: true
  augment: true
  conditional: true

model:
  base_channels: 64
  channel_mult: [1, 2, 2, 4]
  num_res_blocks: 2
  attention_resolutions: [16]
  num_heads: 4
  dropout: 0.1
  use_scale_shift_norm: true
  condition_num_classes: [3, 3, 5]

training:
  batch_size: 128
  learning_rate: 0.0002
  weight_decay: 0.0
  betas: [0.9, 0.999]
  ema_decay: 0.999
  ema_start: 1000
  gradient_clip_norm: 1.0
  num_iterations: 50000
  log_every: 100
  sample_every: 5000
  save_every: 5000
  num_samples: 16

flow_matching:
  time_scale: 1000.0
  min_time: 0.0
  max_time: 1.0
  conditional: true
  condition_dropout: 0.15
  field_dropout: 0.20

sampling:
  num_steps: 50
  sampler: "heun"
  use_ema: false
  guidance_scale: 2.0
  # [smiling, bangs, hair_color]; ids: 0=null, smiling/bangs 1=absent 2=present,
  # hair 1=black 2=blond 3=brown 4=other.
  condition: [2, 1, 2]

infrastructure:
  seed: 42
  device: "cuda"
  num_gpus: 1
  mixed_precision: true
  compile_model: false

checkpoint:
  dir: "./checkpoints"
  resume: null

logging:
  dir: "./logs"
  wandb:
    enabled: false
    project: "cmu-10799-diffusion"
    entity: null
